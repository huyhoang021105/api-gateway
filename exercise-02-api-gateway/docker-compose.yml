name: security-patterns-gateway

x-app-common: &app-common
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - .env
  environment:
    PORT: "3000"
    MINIO_INTERNAL_HOST: minio
    MINIO_INTERNAL_PORT: "9000"
    MINIO_USE_SSL: "false"
  networks:
    - gateway-lab
  restart: unless-stopped

services:
  minio:
    # Official MinIO community images were removed from public registries in 2026.
    # This immutable Bitnami Legacy archive is used only for the local coursework lab.
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    env_file:
      - .env
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/bitnami/minio/data
    networks:
      - gateway-lab
    restart: unless-stopped

  user-service:
    <<: *app-common
    command: ["node", "dist/services/user-service/index.js"]
    ports:
      - "3001:3000"
    depends_on:
      - minio
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s

  order-service:
    <<: *app-common
    command: ["node", "dist/services/order-service/index.js"]
    ports:
      - "3002:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s

  dashboard-bff:
    <<: *app-common
    command: ["node", "dist/services/dashboard-bff/index.js"]
    environment:
      PORT: "3000"
      USER_SERVICE_URL: http://user-service:3000
      ORDER_SERVICE_URL: http://order-service:3000
      DEPENDENCY_TIMEOUT_MS: "2000"
    depends_on:
      user-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 15

  gateway:
    image: nginx:1.28.0-alpine3.21-slim
    ports:
      - "8081:8080"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      user-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      dashboard-bff:
        condition: service_healthy
    networks:
      - gateway-lab
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

networks:
  gateway-lab:
    driver: bridge

volumes:
  minio-data:

