worker_processes auto;
error_log /var/log/nginx/error.log info;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/json;
    access_log /var/log/nginx/access.log combined;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_status 429;

    upstream user_service { server user-service:3000; }
    upstream order_service { server order-service:3000; }
    upstream dashboard_bff { server dashboard-bff:3000; }

    server {
        listen 8080;
        server_name _;
        server_tokens off;

        proxy_http_version 1.1;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;

        location = /health {
            access_log off;
            return 200 '{"status":"ok","service":"api-gateway"}\n';
        }

        location = /_auth {
            internal;
            proxy_pass http://user_service/internal/auth/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-User-Id "";
            proxy_set_header X-User-Role "";
        }

        location /auth/ {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_set_header X-User-Id "";
            proxy_set_header X-User-Role "";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://user_service;
        }

        location /users/ {
            limit_req zone=api_limit burst=10 nodelay;
            auth_request /_auth;
            auth_request_set $authenticated_user_id $upstream_http_x_user_id;
            auth_request_set $authenticated_user_role $upstream_http_x_user_role;
            proxy_set_header X-User-Id $authenticated_user_id;
            proxy_set_header X-User-Role $authenticated_user_role;
            proxy_set_header Authorization "";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://user_service;
        }

        location = /orders {
            limit_req zone=api_limit burst=10 nodelay;
            auth_request /_auth;
            auth_request_set $authenticated_user_id $upstream_http_x_user_id;
            auth_request_set $authenticated_user_role $upstream_http_x_user_role;
            proxy_set_header X-User-Id $authenticated_user_id;
            proxy_set_header X-User-Role $authenticated_user_role;
            proxy_set_header Authorization "";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://order_service;
        }

        location = /dashboard {
            limit_req zone=api_limit burst=10 nodelay;
            auth_request /_auth;
            auth_request_set $authenticated_user_id $upstream_http_x_user_id;
            auth_request_set $authenticated_user_role $upstream_http_x_user_role;
            proxy_set_header X-User-Id $authenticated_user_id;
            proxy_set_header X-User-Role $authenticated_user_role;
            proxy_set_header Authorization "";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://dashboard_bff;
        }

        location / {
            return 404 '{"error":{"code":"NOT_FOUND","message":"Route not found"}}\n';
        }
    }
}

